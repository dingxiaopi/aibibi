# Install in a PRIVATE state repository. Never deploys site code; an accepted collection can
# push its snapshot to the site's data when OFFICIAL_PUBLISH is 'true'.
name: Official prices

on:
  workflow_dispatch:
    inputs:
      source:
        description: Supported = App Store (4 apps) + Gemini web; ChatGPT web may return 403
        type: choice
        options: [supported, ios, gemini, chatgpt]
        default: supported
      mode:
        description: Probe checks sources; collect saves an accepted snapshot privately
        type: choice
        options: [probe, collect]
        default: probe
      regions:
        description: Optional comma-separated region codes; probe defaults us,ph; collect defaults all 14
        type: string
        default: ''
  # Optional daily schedule (UTC). Scheduled runs collect `supported` in all regions and
  # run only when OFFICIAL_SCHEDULE is 'true'. Keep it clear of the shop collection times.
  # schedule:
  #   - cron: '7 3 * * *'

permissions:
  contents: write

# Separate from shop collection: GitHub keeps one pending run per group and a newer one
# cancels it, so sharing the queue could drop a waiting shop run.
concurrency:
  group: aibibi-official
  cancel-in-progress: false

jobs:
  official:
    if: github.event.repository.private && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.OFFICIAL_SCHEDULE == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE: ${{ inputs.source || 'supported' }}
      MODE: ${{ inputs.mode || 'collect' }}
      REGIONS: ${{ inputs.regions || '' }}
    steps:
      - name: Require a pinned reviewed code revision
        env:
          CODE_REF: ${{ vars.OFFICIAL_APP_REF }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['CODE_REF']):
              raise SystemExit('Set OFFICIAL_APP_REF to a reviewed full commit SHA.')
          PYTHON
      - name: Check out private state
        uses: actions/checkout@v4
        with:
          path: state
          ref: main
      - name: Check out reviewed collector code
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.APP_REPOSITORY }}
          ref: ${{ vars.OFFICIAL_APP_REF }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore latest official snapshot
        run: |
          if [ -f state/official-prices/snapshot.json ]; then
            cp state/official-prices/snapshot.json app/cloudflare/shared/official-prices.json
          fi
      - name: Check or collect official sources
        id: collect
        working-directory: app
        run: python3 -m collector.official_actions --source "$SOURCE" --mode "$MODE" --regions "$REGIONS"
      - name: Retain source diagnostics and candidate snapshot
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: official-prices-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/.local/official-prices/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
      - name: Save accepted collection
        if: success() && env.MODE == 'collect'
        working-directory: state
        run: |
          mkdir -p official-prices
          cp ../app/.local/official-prices/snapshot.json official-prices/snapshot.json
          cp ../app/.local/official-prices/report.json official-prices/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- official-prices/snapshot.json official-prices/report.json
          if ! git diff --cached --quiet; then
            git commit -m "Save official prices (run $GITHUB_RUN_ID)"
            for attempt in 1 2 3 4 5; do
              git -c http.version=HTTP/1.1 push origin HEAD:main && exit 0
              [ "$attempt" -lt 5 ] || exit 1
              # A shop collection may have saved its state meanwhile; the files do not overlap.
              sleep "$((attempt * 10))"
              git -c http.version=HTTP/1.1 pull --rebase -q origin main
            done
          fi
      - name: Publish the saved snapshot to the site
        if: success() && env.MODE == 'collect' && vars.OFFICIAL_PUBLISH == 'true'
        working-directory: app
        env:
          BIJIA_URL: ${{ vars.COLLECTOR_URL }}
          BIJIA_INGEST_TOKEN: ${{ secrets.BIJIA_INGEST_TOKEN }}
        run: python3 -m collector.official_actions --mode publish --previous ../state/official-prices/snapshot.json
