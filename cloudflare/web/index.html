<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="%SITE_FAVICON%" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/ai-bibi-wordmark.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <title>%SITE_TITLE%</title>
    <script>
      // Apply the saved theme before first paint; the app keeps it in sync afterwards.
      try {
        if (localStorage.getItem("bijia-theme-v2") === "light")
          document.documentElement.classList.remove("dark");
      } catch {}
    </script>
    <style>
      /* Server-rendered text stays in the document for crawlers and no-JS
         readers; visitors see the styled boot shell until the app mounts. */
      .ssr-fallback { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .boot-bar { background: var(--soft); border-radius: 6px; animation: boot-pulse 1.4s ease-in-out infinite; }
      .boot-main { display: grid; gap: 12px; padding-top: 28px; padding-inline: 24px; }
      .boot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 16px; }
      .boot-card { height: 180px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
      @keyframes boot-pulse { 50% { opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) { .boot-bar { animation: none; } }
      @media (max-width: 640px) { .boot-main.page-shell, .boot-shell .page-shell { padding-inline: 16px; } }
    </style>
    <noscript>
      <style>
        .boot-shell { display: none; }
        .ssr-fallback { position: static; width: auto; height: auto; overflow: visible; clip: auto; white-space: normal; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"><div class="boot-shell" aria-hidden="true">
      <header class="page-shell catalog-header">
        <a href="/" class="catalog-logo" tabindex="-1">
          <img class="brand-mark" src="%SITE_LOGO%" width="100" height="64" alt="" />
          <div><b class="brand-wordmark">%SITE_NAME%</b><small>%SITE_TAGLINE%</small></div>
        </a>
      </header>
      <div class="catalog-nav-wrap"><div class="page-shell catalog-nav-row">
        <div class="boot-bar" style="height: 30px; width: min(560px, 80%)"></div>
      </div></div>
      <main class="page-shell boot-main">
        <div class="boot-bar" style="height: 12px; width: 128px"></div>
        <div class="boot-bar" style="height: 32px; width: min(420px, 90%)"></div>
        <div class="boot-bar" style="height: 16px; width: min(560px, 100%)"></div>
        <div class="boot-grid"><div class="boot-card"></div><div class="boot-card"></div><div class="boot-card"></div></div>
      </main>
    </div></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
